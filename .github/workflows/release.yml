# Pushing a tag vX.Y.Z (npm run release does it) builds the Windows installer and
# publishes it as a GitHub Release. Installed apps see it and offer a one-click update.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в package.json ($v)"
            exit 1
          fi

      - run: npm ci
      - run: npm run fetch-xray
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/release-notes.mjs

      - name: Build and publish the installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
